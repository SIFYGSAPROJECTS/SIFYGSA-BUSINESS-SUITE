services:
  # Servidor Backend en modo desarrollo con recarga en vivo
  server-dev:
    image: node:20-alpine
    container_name: sfg-server-dev
    working_dir: /app
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - JWT_SECRET=dev_jwt_secret_key_12345
    command: sh -c "npm install && npm run dev"
    networks:
      - sfg-dev-network

  # Cliente Frontend en modo desarrollo con Vite HMR
  client-dev:
    image: node:20-alpine
    container_name: sfg-client-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - server-dev
    networks:
      - sfg-dev-network

networks:
  sfg-dev-network:
    name: sfg-dev-network
    driver: bridge
