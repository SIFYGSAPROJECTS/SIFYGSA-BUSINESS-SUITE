services:
  mongo:
    image: mongo:7
    container_name: sifygsa-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      TZ: America/Mexico_City
    volumes:
      - sifygsa_mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: sifygsa-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      TZ: America/Mexico_City
      BACKEND_PORT: 4000
      DATA_DIR: /data
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AUTH_SECRET: ${AUTH_SECRET:-sifygsa_erp_super_secret_jwt_key_2026_production_grade_min32chars}
      SESSION_DURATION_SECONDS: ${SESSION_DURATION_SECONDS:-28800}
      SESSION_INACTIVITY_MINUTES: ${SESSION_INACTIVITY_MINUTES:-30}
      # Por defecto usa el MongoDB incluido en Docker (sin bloqueos de Wi-Fi ni whitelist IP).
      # Si deseas apuntar Docker a MongoDB Atlas, define DOCKER_MONGODB_URI en tu .env
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongo:27017/BitacoraSifigsa}
      MONGODB_BITACORAS_DB: ${MONGODB_BITACORAS_DB:-BitacoraSifigsa}
      MONGODB_IMAGENES_DB: ${MONGODB_IMAGENES_DB:-ImagenesSifigsa}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend/src:/app/src
      - ./data:/data
      - sifygsa_backend_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: sifygsa-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      TZ: America/Mexico_City
      BACKEND_API_URL: http://backend:4000
      AUTH_SECRET: ${AUTH_SECRET:-sifygsa_erp_super_secret_jwt_key_2026_production_grade_min32chars}
      SESSION_DURATION_SECONDS: ${SESSION_DURATION_SECONDS:-28800}
      SESSION_INACTIVITY_MINUTES: ${SESSION_INACTIVITY_MINUTES:-30}
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongo:27017/BitacoraSifigsa}
      MONGODB_BITACORAS_DB: ${MONGODB_BITACORAS_DB:-BitacoraSifigsa}
      MONGODB_IMAGENES_DB: ${MONGODB_IMAGENES_DB:-ImagenesSifigsa}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./data:/app/data
      - ./next.config.ts:/app/next.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - sifygsa_frontend_node_modules:/app/node_modules
      - sifygsa_frontend_next:/app/.next

volumes:
  sifygsa_mongo_data:
  sifygsa_backend_node_modules:
  sifygsa_frontend_node_modules:
  sifygsa_frontend_next:
