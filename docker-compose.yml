services:
  # -------------------------------------------------------------
  # Backend API Monolítico Modular (Node.js + Express)
  # -------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: sfg-business-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-sfg_business_suite_jwt_secret_key_change_me_in_production}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    networks:
      - sfg-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # -------------------------------------------------------------
  # Frontend Cliente (React + Vite + Nginx)
  # -------------------------------------------------------------
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: sfg-business-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - sfg-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  sfg-network:
    name: sfg-network
    driver: bridge
